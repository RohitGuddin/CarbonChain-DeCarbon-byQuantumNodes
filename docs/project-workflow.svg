<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1320" viewBox="0 0 980 1320" role="img" aria-label="DeCarbon project workflow from registration to explorer">
  <rect width="980" height="1320" fill="#ffffff"/>
  <style>
    .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 1.5; }
    .decision { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .stop { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .end { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #0f172a; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #334155; }
    .head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
    .arrow { stroke: #0f172a; stroke-width: 1.5; fill: none; }
    .no { stroke: #b91c1c; stroke-width: 1.5; fill: none; }
  </style>

  <rect class="end" x="390" y="16" width="200" height="44" rx="22"/>
  <text class="label" x="490" y="43" text-anchor="middle">Start</text>
  <line class="arrow" x1="490" y1="60" x2="490" y2="84"/>
  <polygon points="484,78 496,78 490,88" fill="#0f172a"/>

  <rect class="box" x="330" y="88" width="320" height="48" rx="8"/>
  <text class="label" x="490" y="117" text-anchor="middle">Register or login with wallet</text>
  <line class="arrow" x1="490" y1="136" x2="490" y2="168"/>
  <polygon points="484,162 496,162 490,172" fill="#0f172a"/>

  <polygon class="decision" points="490,172 640,228 490,284 340,228"/>
  <text class="label" x="490" y="233" text-anchor="middle">Which role?</text>

  <text class="head" x="230" y="318" text-anchor="middle">Cultivator</text>
  <text class="head" x="750" y="318" text-anchor="middle">Company</text>

  <line class="arrow" x1="340" y1="228" x2="230" y2="228"/>
  <line class="arrow" x1="230" y1="228" x2="230" y2="336"/>
  <polygon points="224,328 236,328 230,340" fill="#0f172a"/>
  <line class="arrow" x1="640" y1="228" x2="750" y2="228"/>
  <line class="arrow" x1="750" y1="228" x2="750" y2="336"/>
  <polygon points="744,328 756,328 750,340" fill="#0f172a"/>

  <rect class="box" x="70" y="340" width="320" height="48" rx="8"/>
  <text class="label" x="230" y="369" text-anchor="middle">Upload plantation photo</text>
  <line class="arrow" x1="230" y1="388" x2="230" y2="416"/>
  <polygon points="224,408 236,408 230,420" fill="#0f172a"/>

  <rect class="box" x="70" y="420" width="320" height="48" rx="8"/>
  <text class="label" x="230" y="449" text-anchor="middle">OpenRouter reviews the evidence</text>
  <line class="arrow" x1="230" y1="468" x2="230" y2="504"/>
  <polygon points="224,496 236,496 230,508" fill="#0f172a"/>

  <polygon class="decision" points="230,508 360,560 230,612 100,560"/>
  <text class="label" x="230" y="565" text-anchor="middle">Mangrove?</text>
  <line class="no" x1="100" y1="560" x2="36" y2="560"/>
  <polygon points="44,554 32,560 44,566" fill="#b91c1c"/>
  <text class="small" x="68" y="548">No</text>
  <rect class="stop" x="8" y="588" width="120" height="44" rx="8"/>
  <text class="small" x="68" y="614" text-anchor="middle">Rejected</text>
  <line class="no" x1="36" y1="560" x2="36" y2="588"/>

  <text class="small" x="246" y="636">Yes</text>
  <line class="arrow" x1="230" y1="612" x2="230" y2="648"/>
  <polygon points="224,640 236,640 230,652" fill="#0f172a"/>

  <rect class="ok" x="70" y="652" width="320" height="48" rx="8"/>
  <text class="label" x="230" y="681" text-anchor="middle">Issue credits and mint NFT</text>
  <line class="arrow" x1="230" y1="700" x2="230" y2="728"/>
  <polygon points="224,720 236,720 230,732" fill="#0f172a"/>

  <rect class="box" x="70" y="732" width="320" height="48" rx="8"/>
  <text class="label" x="230" y="761" text-anchor="middle">Cultivator sets price per credit</text>
  <line class="arrow" x1="230" y1="780" x2="230" y2="808"/>
  <polygon points="224,800 236,800 230,812" fill="#0f172a"/>

  <rect class="ok" x="70" y="812" width="320" height="48" rx="8"/>
  <text class="label" x="230" y="841" text-anchor="middle">Credits listed on marketplace</text>

  <rect class="box" x="590" y="340" width="320" height="48" rx="8"/>
  <text class="label" x="750" y="369" text-anchor="middle">Browse marketplace</text>
  <line class="arrow" x1="750" y1="388" x2="750" y2="416"/>
  <polygon points="744,408 756,408 750,420" fill="#0f172a"/>

  <rect class="box" x="590" y="420" width="320" height="48" rx="8"/>
  <text class="label" x="750" y="449" text-anchor="middle">Backend creates Razorpay order</text>
  <line class="arrow" x1="750" y1="468" x2="750" y2="504"/>
  <polygon points="744,496 756,496 750,508" fill="#0f172a"/>

  <polygon class="decision" points="750,508 880,560 750,612 620,560"/>
  <text class="label" x="750" y="565" text-anchor="middle">Payment captured?</text>
  <line class="no" x1="880" y1="560" x2="948" y2="560"/>
  <polygon points="940,554 952,560 940,566" fill="#b91c1c"/>
  <text class="small" x="900" y="548">No</text>
  <rect class="stop" x="852" y="588" width="120" height="44" rx="8"/>
  <text class="small" x="912" y="606" text-anchor="middle">Stop.</text>
  <text class="small" x="912" y="622" text-anchor="middle">No chain write</text>
  <line class="no" x1="948" y1="560" x2="948" y2="588"/>

  <text class="small" x="766" y="636">Yes</text>
  <line class="arrow" x1="750" y1="612" x2="750" y2="648"/>
  <polygon points="744,640 756,640 750,652" fill="#0f172a"/>

  <polygon class="decision" points="750,652 890,708 750,764 610,708"/>
  <text class="label" x="750" y="704" text-anchor="middle">Razorpay signature</text>
  <text class="label" x="750" y="722" text-anchor="middle">verified?</text>
  <line class="no" x1="890" y1="708" x2="948" y2="708"/>
  <polygon points="940,702 952,708 940,714" fill="#b91c1c"/>
  <text class="small" x="908" y="696">No</text>
  <line class="no" x1="948" y1="708" x2="948" y2="632"/>

  <text class="small" x="766" y="788">Yes</text>
  <line class="arrow" x1="750" y1="764" x2="750" y2="800"/>
  <polygon points="744,792 756,792 750,804" fill="#0f172a"/>

  <rect class="ok" x="590" y="804" width="320" height="56" rx="8"/>
  <text class="label" x="750" y="827" text-anchor="middle">Contract moves credits</text>
  <text class="label" x="750" y="847" text-anchor="middle">seller to buyer on Amoy</text>

  <line class="arrow" x1="390" y1="836" x2="520" y2="836"/>
  <line class="arrow" x1="520" y1="836" x2="520" y2="364"/>
  <line class="arrow" x1="520" y1="364" x2="586" y2="364"/>
  <polygon points="578,358 590,364 578,370" fill="#0f172a"/>
  <text class="small" x="528" y="600">listed credits</text>

  <line class="arrow" x1="750" y1="860" x2="750" y2="900"/>
  <polygon points="744,892 756,892 750,904" fill="#0f172a"/>

  <rect class="box" x="570" y="908" width="360" height="48" rx="8"/>
  <text class="label" x="750" y="937" text-anchor="middle">Save hash, block, and credit rows</text>
  <line class="arrow" x1="750" y1="956" x2="750" y2="984"/>
  <polygon points="744,976 756,976 750,988" fill="#0f172a"/>

  <rect class="box" x="570" y="988" width="360" height="48" rx="8"/>
  <text class="label" x="750" y="1017" text-anchor="middle">PDF invoice for the purchase</text>
  <line class="arrow" x1="750" y1="1036" x2="750" y2="1064"/>
  <polygon points="744,1056 756,1056 750,1068" fill="#0f172a"/>

  <rect class="end" x="530" y="1068" width="440" height="48" rx="8"/>
  <text class="label" x="750" y="1097" text-anchor="middle">Explorer and CO2 graph update</text>
  <line class="arrow" x1="750" y1="1116" x2="750" y2="1144"/>
  <polygon points="744,1136 756,1136 750,1148" fill="#0f172a"/>

  <rect class="end" x="640" y="1148" width="220" height="44" rx="22"/>
  <text class="label" x="750" y="1175" text-anchor="middle">End</text>
</svg>
